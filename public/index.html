<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HooshLive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
    <div class="topbar-start">
      <div class="live-badge">
        <span class="dot"></span>
        <span>LIVE</span>
      </div>
      <div class="time-block">
        <span class="time" id="time">13:23:32</span>
        <span class="date" id="date">1406/06/18</span>
      </div>
      <button class="refresh" id="refreshBtn" aria-label="بروز رسانی"><span>↻</span></button>
    </div>
    <div class="topbar-center">
      <button class="filter-pill">
        <span>فیلترها</span>
        <span class="arrow">▼</span>
      </button>
    </div>
    <div class="topbar-end">
      <div class="search">
        <input type="search" placeholder="جستجوی در خبرها..." id="searchInput" />
        <button class="search-btn" aria-label="جستجو">🔍</button>
      </div>
    </div>
    <div class="brand">
      <span class="brand-name">HooshLive</span>
      <div class="signal">
        <div class="bar b1"></div><div class="bar b2"></div><div class="bar b3"></div><div class="bar b4"></div><div class="bar b5"></div>
      </div>
    </div>
  </header>

  <div class="app-body">
    <main class="news-section">
      <header class="section-header">
        <button class="collapse-toggle" aria-label="بسته/باز کردن">▾</button>
        <h1 class="section-title">نمایش همه خبرها</h1>
        <span class="section-count" id="sectionCount">۰ خبر اخیر</span>
      </header>
      <ul class="news-list" id="newsList" role="list"></ul>
    </main>

    <aside class="sidebar">
      <div class="sidebar-item active" data-view="all">
        <span class="icon">⌨</span>
        <span class="label">همه خبرها</span>
        <span class="badge">⌨</span>
      </div>
      <div class="sidebar-item" data-view="pinned">
        <span class="icon">🔔</span>
        <span class="label">خبرهای نمایش شده</span>
        <span class="badge">🔔</span>
      </div>
      <div class="sidebar-item add-more">
        <button>+ بیشها</button>
      </div>
      <div class="sidebar-divider"></div>
      <div class="sidebar-item" data-folder="urgent">
        <span class="icon">📁</span>
        <span class="label">فوری</span>
        <span class="badge">📁</span>
      </div>
      <div class="sidebar-item" data-folder="leak">
        <span class="icon">📁</span>
        <span class="label">افشا</span>
        <span class="badge">📁</span>
      </div>
      <div class="sidebar-item" data-folder="sports">
        <span class="icon">📁</span>
        <span class="label">ورزشی</span>
        <span class="badge">📁</span>
      </div>
      <div class="sidebar-item" data-folder="season">
        <span class="icon">📁</span>
        <span class="label">سایسه</span>
        <span class="badge">📁</span>
      </div>
      <div class="sidebar-footer">
        <div class="sidebar-item" data-action="settings">
          <span class="icon">⚙</span>
          <span class="label">تنظیمات</span>
        </div>
        <div class="sidebar-item" data-action="about">
          <span class="icon">ℹ</span>
          <span class="label">درباره هوش لایو</span>
        </div>
      </div>
    </aside>
  </div>

  <div class="toast" aria-live="polite"></div>

  </div>

  <script src="/app.js"></script>
</body>
</html>
